<!-- video 07 -> forms and input tasg in html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms and inputs</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Forms to apply for a walkin drive : </h1>

    <form action="post">

      <label for="hiii"> enter name here </label>
      <input type="text" placeholder="enter your username " id="hiii" />
    <hr/>

    <div>
      <label for="hello">Male</label>
      <input type="radio" name="gender" id="hello" value="male" />
      
      <label for="ide">Female</label>
      <input type="radio" name="gender" id="ide" value="female" />
     
    </div>
    <hr/>

    <div>
      <input type="checkbox" name="select" id="123" />
      <label for="123">leetcode done for today? </label>
    </div>
    <hr />

    <div>
      <label for="hii">Enter your comment here : </label>
      <br />
      <textarea name="comment" id="hii" rows="5" cols="500"></textarea>
    </div>
    <hr />

    <div>
      <label for="12">select your fruits : </label>
      <br>
      <select name="fruits" id="12">
        <option value="banana">banana</option>
        <option value="apple">apple</option>
        <option value="cherry">cherry</option>
      </select>
    </div>
    <hr/>

    </form>
  </body>
</html>
