<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excercise-04</title>

    <style>

      body{
        background-color: blanchedalmond;
      }

      *{
        margin: 5px;
        padding: 4px;
        padding-left: 5px;
      }
      nav{
       display: inline-block; 
      }
      :root {
        --color:red;
        --back: skyblue;
        --bodradius: 20px;
        --bod: 2px solid black;
      }

      ul li {
        color: var(--color);
        display: inline;
        margin: 10px;
        padding: 2px 15px 2px 25px;
      }

      nav {
        /* border-radius: var(--bodradius); */
        border: 3px solid skyblue;
      }

      ul li {
        background-color: var(--back);
        border: 1.5px solid black;
        border-radius: var(--bodradius);
      }

    </style>
  </head>
  <body>

    <nav>
      <ul>
        <li>Home</li>
        <li>About us</li>
        <li>Back</li>
        <li>Contact details</li>
      </ul>
    </nav>

  </body>
</html>
