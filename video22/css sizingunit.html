<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>px,rem,em,vw,% and more</title>
    <style>


      *{
        margin: 0;
        padding: 0%;
      }

      html{
        font-size: 12px;
      }

      .box {
        border: 2px solid black;
        /* width: 2048px; */

        /* view port width according to the view : */
        width: 80vw;
        margin: auto;
        background-color: aquamarine;
        box-sizing: border-box;
      }

      .container {
        background-color: brown;
        margin: 23px auto;
        width: 80vw;
        height: 20vh;
        border: 4px solid yellow;
        box-sizing: border-box;

        /* font size example :: now em will make the twice of the font size */
        font-size: 18px;
      }

      .container p{
        /* by default the font size is 16px */
        font-size: 2em;
        /* from the roots 12*2rem */ 
        font-size: 2rem;
      }

    </style>
  </head>
  <body>

    <div class="box">This is about sizing</div>

    <div class="container">
        <p>This is for em i will make multiply of the default size or if any size given it will make multiple of it </p>
        about vh and vw :
      vh and vw are responsive CSS units based on the user's viewport size. They
      help elements adjust according to different screen or browser sizes.
    </div>

  </body>
</html>
