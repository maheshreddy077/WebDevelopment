<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entities and code tags</title>
  </head>
  <body>
    <!-- 01 : Entities =>  html entities are essential for rendering chartacters on web page 
    &lt; -> for <
    &gt; -> for >
    &nbsp; -> whitespace
    &copy; -> for copy right symbol -->
    <pre>
        <p>
            hi my age &lt;25 and &gt;18
        </p>
    </pre>

<!-- code tag :: it will show the code as it is -->
    <pre>
        <code>
&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
&lt;meta charset="UTF-8"&gt;
&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
&lt;title&gt;Entities and code tags &lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;  
        </code>
     </pre>
     
  </body>
</html>
