<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX-SHADOW</title>

    <style>
        .box{
            border: 2px solid black;
            padding: 34px;

            /* HORIZONTAL OFFSET V-OFFSET BLUR COLOR */
            box-shadow: 5px 4px 5px red ;
        }

        .text_element{
            text-shadow: 1px 2px 2px red;
            outline: 6px solid black;
            border: 5px solid red;
            border-radius: 54px;
        }
    </style>

</head>
<body>
    <div class="box">
        I am a box
    </div>

    <P class="text_element">
        HEYYY !! HERE HIII I'M MAHESH REDDY
    </P>
</body>
</html>
