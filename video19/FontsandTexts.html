<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts texts and color properties : </title>

    <style>
        h1{
            text-align: center;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .f{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: italic;
            font-weight: 700;

            /* height between the lines  */
            line-height: 5; 

            font-size: 30px;
            text-decoration: overline;
           
        }

        h3{
            text-align: center;
            text-transform: capitalize;
            text-transform: uppercase;
            text-transform: lowercase;

            /* text decoration */
            text-decoration: underline;
            text-decoration-color: rgb(8, 145, 145);
            text-decoration-style: unset;
            text-decoration-thickness: 7px;
            text-indent:26px;
        }

        .lorem{
            text-align: center;
            border: 4px solid rgb(18, 18, 18);
            width: 200px;
            word-break: break-all;
            text-overflow: ellipsis;
            overflow: hidden;
        }
    </style>


</head>
<body>

    <!-- font family -->
    <div>
        <h1>Fonts : </h1>
        <p class="f">This is on fonts</p>
    </div>

    <h3>
        text-transformation
    </h3>

    <p class="lorem">Lorem, ipsum dolor sit amet consectetur adipisicing elit. 
        Sunt animi soluta accusantium dolor 
        aspernatur inventore doloribus odio aut autem asperiores!</p>
</body>
</html>
