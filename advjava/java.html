    <style>
      * {

      }

      nav span {
        padding-bottom: 30px;
        font-weight: 100;

        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",

      }
      nav img {
        padding-left: 10px;
        padding-top: 10px;
      }
      body {
        background-color: lightgray;
      }

      nav {
        border: 2px solid black;

        height: 60px;
        width: 100vw;
        background-color: darkblue;
      }

      nav ul {
        padding-top: 15px;
        font-family: sans-serif;
        font-weight: 500;
        font-size: large;
        padding-right: 30px;
        list-style-type: none;
        justify-content: flex-end;
        display: flex;
        gap: 40px;

      nav ul a {
        text-decoration: none;

      }

      a:hover {

      }

        color: yellow;
      }

      main {
        border: 2px solid black;
        height: 70vh;
        background-color: white;
      }

      table {
        margin: 80px auto;
        font-size: 18px;
      }

      th {
        background-color: lightblue;
      }

      th,
      td {
        padding: 15px 30px;
      }

      td {
        background-color: #f5f5f5;
      }

      footer {
        background-color: darkblue;
        color: white;
        height: 20vh;
      }

      .but {
        background-color: rgb(198, 222, 222);
        height: 30px;
        width: 50px;
        border-radius: 10px;
      }

      footer p {
        text-align: center;
        padding-top: 30px;
        font-size: large;
      }

      nav ul .logo {
        position: relative;
        bottom: 15px;
        margin-right: auto;
      }

      li:hover {
        transform: scale(1.2);
      }
    </style>
  </head>
