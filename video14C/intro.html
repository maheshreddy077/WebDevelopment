CSS – Introduction
CSS (Cascading Style Sheets) is used to style and design HTML webpages.

Uses of CSS ::

Change text color
Change font size and font style
Change background color
Add borders
Set width and height
Add margin and padding
Create layouts
Make webpages responsive
Add simple animations and effects

Basic Syntax
selector {
    property: value;
}

Example:
h1 {
    color: blue;
    font-size: 30px;
}

h1 → Selector
color → Property
blue → Value

Ways to Apply CSS
Inline CSS
<h1 style="color: red;">Hello</h1>
Internal CSS
<style>
    h1 {
        color: blue;
    }
</style>

External CSS ⭐
<link rel="stylesheet" href="style.css">

External CSS is preferred for larger websites.

Simple Example
HTML:

<h1>Hello World</h1>
<p>I am learning CSS.</p>

CSS:

h1 {
    color: blue;
}

p {
    font-size: 20px;
}

Easy Remember ::

HTML → Structure 🏗️
CSS → Design 🎨
JavaScript → Function/Behavior ⚙️ -->
