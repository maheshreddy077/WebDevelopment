<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXCERCISE-06</title>

    <style>
      .head {
        display: flex;
        font-size: large;

        float: right;

        gap: 40px;
        font-family: sans-serif;
        font-weight: 100;
        padding-top: 10px;
        padding-right: 40px;
      }

       a:hover {
        border-radius: 20px ;
        transform: scale(1.2);
        background-color: rgb(199, 235, 235);
        
        display: inline-block; /* allows transform to work properly */
        transition: transform 0.5s; /* smooth effect */
    }

      .item a {
        text-decoration: none;
        color: #081d1d;
      }

      :hover a {
        background-color: rgb(199, 235, 235);
      }
    </style>
  </head>
  <body>
    <header class="head">
      <div class="item"><a href="#" target="_blank">Products</a></div>
      <div class="item"><a href="">Pricing</a></div>
      <div class="item"><a href="">Resources</a></div>
      <div class="item"><a href="">About us</a></div>
    </header>
  </body>
</html>
